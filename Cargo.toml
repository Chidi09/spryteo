[workspace]
resolver = "2"
members = ["crates/*", "bindings/wasm", "bindings/node"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["chidiisking7@gmail.com"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
