[workspace]
resolver = "2"
members = ["crates/*", "bindings/wasm", "bindings/node"]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["chidiisking7@gmail.com"]
repository = "https://github.com/Chidi09/spryteo.git"
homepage = "https://spryteo.vercel.app"
documentation = "https://docs.rs/spryteo"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes the parser correctly rounded. Without it serde_json
# takes a fast path that can land a ULP away from the value that was written,
# and the metadata sidecar is an interchange format whose coordinates have to
# survive a write/read cycle unchanged.
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "1"
rayon = "1.12"
ort = "2.0.0-rc.12"
