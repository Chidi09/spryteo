[package]
name = "spryteo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "spryteo CLI binary (clap)."

[[bin]]
name = "spryteo"
path = "src/main.rs"

[lib]
name = "spryteo_cli"
path = "src/lib.rs"

[dependencies]
spryteo-core = { path = "../spryteo-core", version = "0.0.2" }
spryteo-engine = { path = "../spryteo-engine", version = "0.0.2", features = ["parallel"] }
spryteo-raster = { path = "../spryteo-raster", version = "0.0.2" }
spryteo-quant = { path = "../spryteo-quant", version = "0.0.2" }
spryteo-trace = { path = "../spryteo-trace", version = "0.0.2", features = ["parallel"] }
spryteo-fit = { path = "../spryteo-fit", version = "0.0.2", features = ["parallel"] }
spryteo-svg = { path = "../spryteo-svg", version = "0.0.2" }
spryteo-stroke = { path = "../spryteo-stroke", version = "0.0.2" }
spryteo-sheet = { path = "../spryteo-sheet", version = "0.0.2" }
spryteo-geom = { path = "../spryteo-geom", version = "0.0.2" }
spryteo-semantic = { path = "../spryteo-semantic", version = "0.0.2" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
ml = ["spryteo-semantic/ml", "spryteo-engine/ml"]

[[bench]]
name = "pipeline"
harness = false

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg"] }
criterion = "0.5"
resvg = "0.44"
tiny-skia = "0.11"
fontdb = "0.22"
