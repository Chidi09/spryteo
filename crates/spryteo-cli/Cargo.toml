[package]
name = "spryteo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "spryteo CLI binary (clap)."

[[bin]]
name = "spryteo"
path = "src/main.rs"

[lib]
name = "spryteo_cli"
path = "src/lib.rs"

[dependencies]
spryteo-core = { path = "../spryteo-core" }
spryteo-raster = { path = "../spryteo-raster" }
spryteo-quant = { path = "../spryteo-quant" }
spryteo-trace = { path = "../spryteo-trace", features = ["parallel"] }
spryteo-fit = { path = "../spryteo-fit", features = ["parallel"] }
spryteo-svg = { path = "../spryteo-svg" }
spryteo-stroke = { path = "../spryteo-stroke" }
spryteo-semantic = { path = "../spryteo-semantic" }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
ml = ["spryteo-semantic/ml"]

[[bench]]
name = "pipeline"
harness = false

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
criterion = "0.5"
resvg = "0.44"
tiny-skia = "0.11"
fontdb = "0.22"
