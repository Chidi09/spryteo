[package]
name = "spryteo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "spryteo CLI binary (clap)."

[[bin]]
name = "spryteo"
path = "src/main.rs"

[lib]
name = "spryteo_cli"
path = "src/lib.rs"

[dependencies]
spryteo-core = { path = "../spryteo-core" }
spryteo-raster = { path = "../spryteo-raster" }
spryteo-quant = { path = "../spryteo-quant" }
spryteo-trace = { path = "../spryteo-trace" }
spryteo-fit = { path = "../spryteo-fit" }
spryteo-svg = { path = "../spryteo-svg" }
spryteo-stroke = { path = "../spryteo-stroke" }

clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bench]]
name = "pipeline"
harness = false

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
criterion = "0.5"
