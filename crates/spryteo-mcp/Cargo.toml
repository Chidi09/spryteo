[package]
name = "spryteo-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "MCP server exposing the Spryteo engine as agent-callable tools (convert_image, inspect_svg)."

[[bin]]
name = "spryteo-mcp"
path = "src/main.rs"

[dependencies]
spryteo-core = { path = "../spryteo-core", version = "0.0.2" }
spryteo-engine = { path = "../spryteo-engine", version = "0.0.2", features = ["parallel"] }

serde.workspace = true
serde_json.workspace = true
rmcp = { version = "2", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
