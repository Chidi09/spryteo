[package]
name = "spryteo-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "napi-rs native Node.js addon exposing the Spryteo engine (npm package: spryteo)."

# Not published to crates.io. This is the Rust half of an npm package
# (`spryteo`), not a library anyone depends on from Cargo, and its
# spryteo-* dependencies are path-only -- a registry publish would need a
# version on each. Without this key `cargo publish --workspace` tries it
# every release and fails on those paths.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
spryteo-core = { path = "../../crates/spryteo-core" }
spryteo-engine = { path = "../../crates/spryteo-engine", features = ["parallel"] }

serde.workspace = true
serde_json.workspace = true
napi = { version = "2", default-features = false, features = ["napi4", "serde-json", "tokio_rt"] }
napi-derive = "2"


[build-dependencies]
napi-build = "2"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

