[package]
name = "spryteo-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "wasm-bindgen browser build of the Spryteo engine; powers the hero demo."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spryteo-core = { path = "../../crates/spryteo-core" }
# No `parallel`: rayon threads in the browser need cross-origin isolation
# headers the demo host does not set.
spryteo-engine = { path = "../../crates/spryteo-engine" }
spryteo-sheet = { path = "../../crates/spryteo-sheet" }

serde.workspace = true
serde_json.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.wasm-pack.profile.release]
# wasm-opt 108 corrupts wasm-bindgen 0.2.126's externref table during
# optimization -- produces "RangeError: WebAssembly.Table.grow(): failed
# to grow table by 4" at init time in the browser. Confirmed by manual
# browser testing: identical build with wasm-opt disabled works
# correctly; with it enabled, module init throws every time. Re-check
# this pin if either dependency's version changes.
wasm-opt = false

