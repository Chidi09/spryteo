[package]
name = "spryteo-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "wasm-bindgen browser build of the Spryteo engine; powers the hero demo."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spryteo-core = { path = "../../crates/spryteo-core" }
spryteo-raster = { path = "../../crates/spryteo-raster" }
spryteo-quant = { path = "../../crates/spryteo-quant" }
spryteo-trace = { path = "../../crates/spryteo-trace" }
spryteo-fit = { path = "../../crates/spryteo-fit" }
spryteo-stroke = { path = "../../crates/spryteo-stroke" }
spryteo-svg = { path = "../../crates/spryteo-svg" }

serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[package.metadata.wasm-pack.profile.release]
# wasm-opt 108 corrupts wasm-bindgen 0.2.126's externref table during
# optimization -- produces "RangeError: WebAssembly.Table.grow(): failed
# to grow table by 4" at init time in the browser. Confirmed by manual
# browser testing: identical build with wasm-opt disabled works
# correctly; with it enabled, module init throws every time. Re-check
# this pin if either dependency's version changes.
wasm-opt = false

